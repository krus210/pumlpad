# Builds the standalone app for Apple Silicon and for Intel from a version tag (v0.1.2, say),
# attests where the zips came from and publishes them as a release. Run by hand, it builds and attests without releasing, to try
# the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: jdk-x86_64
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: jdk-arm64
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Resources/Info.plist says $version, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # The Intel build runs under Rosetta here: its jlink, and the render that tries it out.
      - name: Build the apps with PlantUML and Java inside
        run: |
          build() {
            ARCH="$1" JDK_HOME="$2" make app-standalone
            resources=build/Pumlpad.app/Contents/Resources
            [[ "$(lipo -archs build/Pumlpad.app/Contents/MacOS/Pumlpad)" == "$1" ]]
            [[ "$(lipo -archs "$resources/jre/bin/java")" == "$1" ]]
            printf '@startuml\nAlice -> Bob\n@enduml\n' \
              | "$resources/jre/bin/java" -Djava.awt.headless=true -jar "$resources/plantuml.jar" -pipe -tsvg \
              | grep -q "<svg"
            ditto -c -k --sequesterRsrc --keepParent build/Pumlpad.app "$3"
          }
          build arm64 "$JDK_ARM64" Pumlpad-apple-silicon.zip
          build x86_64 "$JDK_X86_64" Pumlpad-intel.zip
          shasum -a 256 Pumlpad-*.zip
        env:
          JDK_ARM64: ${{ steps.jdk-arm64.outputs.path }}
          JDK_X86_64: ${{ steps.jdk-x86_64.outputs.path }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Pumlpad-*.zip
      - name: Keep the zips of a trial build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pumlpad
          path: Pumlpad-*.zip
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256:"
            echo
            shasum -a 256 Pumlpad-*.zip | sed 's/^/    /' 
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Pumlpad-*.zip --verify-tag \
            --title "Pumlpad ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
