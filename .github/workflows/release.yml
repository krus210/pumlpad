# Builds the standalone app from a version tag (v0.1.2, say), attests where the zip came from
# and publishes it as a release. Run by hand, it builds and attests without releasing, to try
# the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Resources/Info.plist says $version, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build the app with PlantUML and Java inside
        run: make app-standalone
        env:
          JDK_HOME: ${{ env.JAVA_HOME }}
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Pumlpad.app Pumlpad.zip
          shasum -a 256 Pumlpad.zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Pumlpad.zip
      - name: Keep the zip of a trial build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pumlpad
          path: Pumlpad.zip
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256 of Pumlpad.zip: \`$(shasum -a 256 Pumlpad.zip | cut -d ' ' -f 1)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Pumlpad.zip --verify-tag \
            --title "Pumlpad ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
