name: Bug report
description: Something in Pumlpad does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, please use [private reporting](https://github.com/krus210/pumlpad/security/advisories/new) instead of an issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Diagram
      description: The smallest diagram that shows the problem, if there is one.
      render: text
  - type: input
    id: version
    attributes:
      label: Pumlpad version
      description: Pumlpad › About Pumlpad, or the commit you built.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.6, MacBook Air M2
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build
      options:
        - Download from Releases
        - make app-standalone
        - make app, with Homebrew's PlantUML
    validations:
      required: true
